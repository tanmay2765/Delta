# Fly.io backend — free allowance (alternative to Railway)
# Install: brew install flyctl && fly auth login
# Deploy: cd backend && fly launch --no-deploy && fly volumes create delta_data -r bom -s 1 && fly deploy

app = 'delta-meet-api'
primary_region = 'bom'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_URL = 'sqlite:////data/delta.db'
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    path = '/'

[[mounts]]
  source = 'delta_data'
  destination = '/data'

[vm]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
